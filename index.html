<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IlumaPlay</title>
    <meta
      name="description"
      content="IlumaPlay is an interactive lamp with collectible figures and discovery cards for children."
    >
    <link rel="preload" as="image" href="assets/img_5346.jpg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page" aria-label="IlumaPlay">
      <header class="site-header">
        <a class="logo" href="#" aria-label="IlumaPlay">
          <span class="logo-star" aria-hidden="true">&#10022;</span>
          <span>IlumaPlay</span>
        </a>
        <div class="language-switch" aria-label="Language">
          <button class="lang-button is-active" type="button" data-lang="en">EN</button>
          <button class="lang-button" type="button" data-lang="pt">PT</button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-text">
          <p data-i18n="intro">
            IlumaPlay is an interactive lamp with collectible figures and discovery cards.
            Children need a task, find the matching figure and place it on the lamp to
            remember what they learned.
          </p>
        </div>
        <div class="hero-visual" aria-label="IlumaPlay lamp and discovery set">
          <img class="kit-image" src="assets/kit-cutout.png" alt="IlumaPlay cloth bag and discovery card">
          <img class="lamp-image" src="assets/lamp-cutout.png" alt="IlumaPlay lamp with colorful figures">
        </div>
      </section>

      <section class="thumbs" aria-label="Product photos">
        <button class="thumb" type="button" data-src="assets/img_5229.jpg" aria-label="Open product photo 1">
          <img src="assets/thumb-space.jpg" alt="IlumaPlay lamp glowing with space figures">
        </button>
        <button class="thumb" type="button" data-src="assets/img_5400.jpg" aria-label="Open product photo 2">
          <img src="assets/thumb-dino.jpg" alt="IlumaPlay lamp with nature and dinosaur figures">
        </button>
        <button class="thumb" type="button" data-src="assets/img_5321.jpg" aria-label="Open product photo 3">
          <img src="assets/thumb-flowers.jpg" alt="IlumaPlay lamp with flower figures">
        </button>
      </section>

      <section class="tagline" aria-label="Product message">
        <p data-i18n="tagline">Build your collection! Explore worlds</p>
      </section>

      <section class="video-block" aria-label="IlumaPlay video">
        <video controls preload="metadata" poster="assets/video-poster.jpg">
          <source src="assets/story.mp4" type="video/mp4">
          Your browser does not support video playback.
        </video>
      </section>

      <footer class="contact">
        <p>
          <span data-i18n="contact">Contact us:</span>
          <a href="mailto:ilumaplaygeral@gmail.com">ilumaplaygeral@gmail.com</a>
        </p>
      </footer>
    </main>

    <dialog class="lightbox" aria-label="Photo preview">
      <button class="close" type="button" aria-label="Close">&times;</button>
      <img src="assets/img_5229.jpg" alt="">
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
